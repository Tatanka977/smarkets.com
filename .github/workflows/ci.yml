name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed yet, so this falls back to a plain `npm
      # install` instead of `npm ci`. Once package-lock.json is committed,
      # switch this to `npm ci` for fully reproducible installs.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
